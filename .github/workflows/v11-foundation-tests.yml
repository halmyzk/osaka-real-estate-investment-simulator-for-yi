name: v1.1 foundation validation
on:
  push:
    branches:
      - develop/v1.1-foundation
    paths:
      - "schema/**"
      - "tests/**"
      - ".github/workflows/v11-foundation-tests.yml"
      - "src/**"
  pull_request:
    paths:
      - "schema/**"
      - "tests/**"
      - "src/**"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install -r tests/requirements-dev.txt
      - name: Run schema and arithmetic tests
        run: python tests/validate_v11.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Gate A operating model tests
        run: node --test tests/operations.test.mjs
